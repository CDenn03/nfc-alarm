<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- NFC waves (left side) -->
  <g fill="none" stroke="#E53935" stroke-width="18" stroke-linecap="round">
    <!-- Outer wave -->
    <path d="M120 180 Q80 256 120 332" opacity="0.4"/>
    <!-- Middle wave -->
    <path d="M155 205 Q125 256 155 307" opacity="0.7"/>
    <!-- Inner wave -->
    <path d="M190 230 Q170 256 190 282" opacity="1"/>
  </g>
  
  <!-- Alarm bell icon (center-right) -->
  <g fill="#ffffff">
    <!-- Bell body -->
    <path d="M310 180 
             C310 160 330 145 360 145 
             C390 145 410 160 410 180
             L420 290
             C420 305 405 315 360 315
             C315 315 300 305 300 290
             Z"/>
    <!-- Bell top -->
    <circle cx="360" cy="135" r="18"/>
    <!-- Bell clapper/bottom -->
    <ellipse cx="360" cy="330" rx="30" ry="18"/>
  </g>
  
  <!-- Connection dot (between NFC and bell) -->
  <circle cx="245" cy="256" r="12" fill="#E53935"/>
  
  <!-- Small accent dots (dot-matrix style from inspiration) -->
  <g fill="#E53935" opacity="0.6">
    <circle cx="100" cy="400" r="6"/>
    <circle cx="125" cy="400" r="6"/>
    <circle cx="150" cy="400" r="6"/>
  </g>
</svg>
